# PRD §21.4. First match wins.

# Inside the container: init scripts, healthcheck, docker compose exec.
local   all  all                       trust
host    all  all   127.0.0.1/32        scram-sha-256

# The services, through the 127.0.0.1:5433 port. docker-proxy relays those connections, so they
# arrive from the bridge gateway pinned in deploy/docker-compose.deploy.yml.
host    all  all   172.30.0.1/32       scram-sha-256

# Everyone else: platform roles and databases are refused by name, even with the right password.
host    all                                  sw_app,sw_data,postgres  0.0.0.0/0  reject
host    all                                  sw_app,sw_data,postgres  ::/0       reject
host    sw_app,postgres,template0,template1  all                      0.0.0.0/0  reject
host    sw_app,postgres,template0,template1  all                      ::/0       reject

# Store read-only logins, over TLS only.
hostssl all  all   0.0.0.0/0           scram-sha-256
hostssl all  all   ::/0                scram-sha-256
